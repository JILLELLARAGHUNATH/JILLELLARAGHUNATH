 <text x="20" y="240" fill="#e8f1ff" font-family="Segoe UI,Arial,sans-serif" font-size="18">Building practical software, intelligent</text>
 <text x="20" y="265" fill="#e8f1ff" font-family="Segoe UI,Arial,sans-serif" font-size="18">systems and meaningful digital experiences.</text>
