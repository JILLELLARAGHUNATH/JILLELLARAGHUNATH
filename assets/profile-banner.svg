 <text x="118" y="88" fill="#F3F7FF" font-size="27" font-weight="600">HELLO, I'M</text>
 <text x="66" y="178" fill="#FFFFFF" font-size="76" font-weight="800" letter-spacing="-2">Jillella</text>
 <text x="300" y="178" fill="url(#accent)" font-size="76" font-weight="800" letter-spacing="-2">Raghunath</text>
 <text x="680" y="174" fill="#FFD66B" font-size="48">✦</text>
 <rect x="70" y="207" width="590" height="58" rx="29" fill="#0B2850" stroke="url(#accent)" stroke-width="2"/>
 <text x="98" y="245" fill="#F8FAFF" font-size="27" font-weight="700">Full Stack Developer  ·  Persevex LLP</text>
 <rect x="70" y="296" width="5" height="58" rx="2" fill="#28D9F4"/>
 <text x="94" y="319" fill="#E5F0FF" font-size="23">Building practical software, intelligent systems</text>
 <text x="94" y="350" fill="#E5F0FF" font-size="23">and meaningful digital experiences.</text>
 <g font-size="18" font-weight="700" text-anchor="middle">
  <rect x="70" y="394" width="150" height="48" rx="24" fill="#0867C8" stroke="#35D9FF"/><text x="145" y="425" fill="#FFF">in  LinkedIn</text>
  <rect x="234" y="394" width="132" height="48" rx="24" fill="#10294C" stroke="#4D8BCB"/><text x="300" y="425" fill="#FFF">GitHub</text>
  <rect x="380" y="394" width="112" height="48" rx="24" fill="#10294C" stroke="#4D8BCB"/><text x="436" y="425" fill="#FFF">Email</text>
  <rect x="506" y="394" width="184" height="48" rx="24" fill="url(#accent)"/><text x="598" y="425" fill="#07152D">Live Portfolio ↗</text>
 </g>
</g>
