<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Jillella Raghunath — Full Stack Developer</title>
<desc id="desc">A premium navy and electric-blue developer banner with neon cyan and violet accents, a custom code workstation, and technology symbols.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152d"/><stop offset=".55" stop-color="#102c50"/><stop offset="1" stop-color="#252052"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22e6e0"/><stop offset=".55" stop-color="#4e9dff"/><stop offset="1" stop-color="#bd6bff"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#0b1e37"/><stop offset="1" stop-color="#142d50"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8acbff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect width="1200" height="400" rx="24" fill="url(#grid)"/>
