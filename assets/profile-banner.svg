<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">Jillella Raghunath — Full Stack Developer</title>
<desc id="desc">A polished midnight navy developer banner with cyan and violet lighting, technology emblems, and a detailed illustrated developer workspace.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152D"/><stop offset=".48" stop-color="#0A1D3D"/><stop offset="1" stop-color="#11133C"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#24D8F2"/><stop offset=".52" stop-color="#6488FF"/><stop offset="1" stop-color="#C45CFF"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B2349"/><stop offset="1" stop-color="#15265A"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9A878"/><stop offset="1" stop-color="#A95F55"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#145D9D"/><stop offset="1" stop-color="#172D67"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#5BA8E9" stroke-opacity=".10"/></pattern>
 </defs>
<rect width="1500" height="500" rx="28" fill="url(#bg)"/>
