<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d">
<title id="t">Animated developer activity graph</title><desc id="d">A decorative animated line chart with a moving highlight and glowing nodes. It is a visual animation, not live contribution data.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#173b59"/><stop offset=".55" stop-color="#28436b"/><stop offset="1" stop-color="#4c3d78"/></linearGradient><linearGradient id="line" x2="1"><stop stop-color="#61e8dc"/><stop offset=".55" stop-color="#8db7ff"/><stop offset="1" stop-color="#d5a2ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1000" height="330" rx="22" fill="url(#bg)"/><text x="42" y="48" fill="#f3f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Build momentum</text><text x="43" y="73" fill="#c1d3ec" font-family="Segoe UI,Arial,sans-serif" font-size="13">A little progress, consistently</text>
<g stroke="#b7cde7" stroke-opacity=".16" stroke-dasharray="3 8"><path d="M55 110H950M55 155H950M55 200H950M55 245H950M55 290H950"/><path d="M100 95V290M220 95V290M340 95V290M460 95V290M580 95V290M700 95V290M820 95V290M940 95V290"/></g>
<path d="M55 270 C110 270 120 260 165 260 S230 210 280 225 S350 255 395 215 S465 190 510 205 S570 240 615 190 S690 165 730 185 S790 220 835 155 S900 125 950 105" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1500" stroke-dashoffset="1500" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1500" to="0" dur="3.2s" repeatCount="indefinite"/></path>
<path d="M55 270 C110 270 120 260 165 260 S230 210 280 225 S350 255 395 215 S465 190 510 205 S570 240 615 190 S690 165 730 185 S790 220 835 155 S900 125 950 105 L950 290 L55 290Z" fill="#6ddbd5" opacity=".08"/>
<g fill="#e7ffff" stroke="#62e8dc" stroke-width="3" filter="url(#glow)"><circle cx="280" cy="225" r="5"><animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="510" cy="205" r="5"><animate attributeName="r" values="4;8;4" dur="1.8s" begin=".5s" repeatCount="indefinite"/></circle><circle cx="730" cy="185" r="5"><animate attributeName="r" values="4;8;4" dur="1.8s" begin="1s" repeatCount="indefinite"/></circle><circle cx="950" cy="105" r="6"><animate attributeName="r" values="5;10;5" dur="1.8s" begin="1.3s" repeatCount="indefinite"/></circle></g>
<text x="55" y="315" fill="#c1d3ec" font-family="Segoe UI,Arial,sans-serif" font-size="12">LEARN</text><text x="500" y="315" fill="#c1d3ec" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">BUILD</text><text x="950" y="315" fill="#c1d3ec" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end">IMPROVE</text></svg>